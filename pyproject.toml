[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "canirunlocalai"
version = "0.2.0"
description = "Privacy-first local hardware scanner, model fit advisor, and local inference benchmark."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "CanIRunLocalAI contributors" }]
keywords = ["local-ai", "llm", "ollama", "hardware", "gpu", "vram", "llama-cpp", "benchmark"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: System :: Hardware",
  "Topic :: Utilities"
]
dependencies = ["psutil>=5.9.8"]

[project.urls]
Homepage = "https://github.com/clintkosh/CanIRunLocalAI"
Issues = "https://github.com/clintkosh/CanIRunLocalAI/issues"

[project.scripts]
canirunlocalai = "canirunlocalai.cli:main"
cirla = "canirunlocalai.cli:main"

[tool.setuptools.package-data]
canirunlocalai = ["models_catalog.json"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
